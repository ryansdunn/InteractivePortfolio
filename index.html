<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ryan Dunn — an interactive portrait</title>
  <meta name="description" content="An interactive RPG portfolio. Walk around, talk to characters, and discover who Ryan Dunn is — a builder in code, music, and a classroom in Spain." />

  <!-- Phaser 3 + SoundCloud Widget API via CDN. No build step. -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"
          integrity="sha384-Fi7F0CYQBHYa+s2vvYJeiqvOQf3tuZ28vafRGXvMt7ijxNTVf3+eXPkNRIUi9JD2"
          crossorigin="anonymous"></script>
  <script src="https://w.soundcloud.com/player/api.js"></script>

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:,">
</head>
<body>
  <!-- Phaser canvas mounts here -->
  <div id="game"></div>

  <!-- DOM overlay layer (HUD) -->
  <div id="profile-card" class="overlay"></div>
  <div id="hearts" class="overlay"></div>
  <div id="fragment" class="overlay"></div>
  <div id="dialogue-box"></div>
  <div id="info-panel"></div>
  <div id="music-player"></div>
  <div id="hint" class="overlay"></div>
  <div id="toast" class="overlay"></div>

  <!-- Load order matters (classic scripts, global scope, no modules):
       1) config  2) core engine  3) components  4) scenes/worlds  5) bootstrap -->

  <!-- 1) Config (pure data) -->
  <script src="config/world.js"></script>
  <script src="config/projects.js"></script>
  <script src="config/music.js"></script>
  <script src="config/doubts.js"></script>

  <!-- 2) Core engine -->
  <script src="core/AssetFactory.js"></script>
  <script src="core/GameState.js"></script>
  <script src="core/AudioManager.js"></script>
  <script src="core/CombatSystem.js"></script>
  <script src="core/TiledWorldScene.js"></script>

  <!-- 3) Components -->
  <script src="components/DialogueBox.js"></script>
  <script src="components/ProfileCard.js"></script>
  <script src="components/InfoPanel.js"></script>
  <script src="components/MusicPlayer.js"></script>
  <script src="components/MobileControls.js"></script>
  <script src="components/FragmentCard.js"></script>

  <!-- 4) Scenes -->
  <script src="scenes/BootScene.js"></script>
  <script src="scenes/TitleScene.js"></script>

  <!-- 5) Bootstrap (last) -->
  <script src="game.js"></script>
</body>
</html>
